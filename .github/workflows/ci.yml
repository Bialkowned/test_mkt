name: CI

# Runs on the self-hosted org runner on Prod01: GitHub-hosted minutes are billing-blocked,
# so hosted runs failed without executing a step. There is no Docker on that host, so no
# `services:` containers -- tests use the throwaway Tester_Company_test database on the
# local Mongo. Typecheck is not run here: type errors are a tracked baseline, not a gate.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: [self-hosted, prod01]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m venv .ci-venv
          ./.ci-venv/bin/pip install --quiet --upgrade pip
          ./.ci-venv/bin/pip install --quiet -r requirements.txt
      - name: Format check (ruff)
        run: ./.ci-venv/bin/ruff format --check --exclude .ci-venv .
      - name: Tests
        env:
          MONGO_URI: "mongodb://127.0.0.1:27017"
          TEST_DATABASE_NAME: "Tester_Company_test"
        run: ./.ci-venv/bin/python -m pytest tests -q --tb=short

  frontend:
    name: Frontend
    runs-on: [self-hosted, prod01]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build (scratch dir, never the served one)
        env:
          BUILD_DIR: .ci-build
        run: npm run build
